name: Antigravity 24/7 Growth Agent Runner

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-growth-agents:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Master Growth Orchestrator
        env:
          TARGET_APP_URL: "https://cerulean-marshmallow-003d16.netlify.app/"
        run: npm start

      - name: Execute Content Curator Seeding
        run: npm run curate

      - name: Execute Outreach Scout
        run: npm run outreach
